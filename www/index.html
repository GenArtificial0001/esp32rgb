<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selector RGB · ESP32</title>
<style>
  :root {
    --bg: #0f1115; --card: #181b22; --text: #e8eaf0; --muted: #8a90a0;
    --line: #2a2f3a; --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  .card {
    width: 100%; max-width: 380px; background: var(--card);
    border: 1px solid var(--line); border-radius: 18px; padding: 22px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  .preview {
    height: 120px; border-radius: 14px; margin-bottom: 18px;
    display: grid; place-items: center; transition: background .15s, box-shadow .15s;
    border: 1px solid var(--line);
  }
  .preview span {
    font: 600 20px ui-monospace, Consolas, monospace;
    background: rgba(0,0,0,.45); padding: 4px 10px; border-radius: 8px;
  }
  .row { display: grid; grid-template-columns: 22px 1fr 44px; gap: 10px;
         align-items: center; margin: 10px 0; }
  .row label { font-weight: 700; }
  .row output { text-align: right; font-family: ui-monospace, Consolas, monospace; color: var(--muted); }
  input[type=range] { width: 100%; height: 8px; border-radius: 6px; appearance: none; outline: none; }
  input[type=range]::-webkit-slider-thumb {
    appearance: none; width: 20px; height: 20px; border-radius: 50%;
    background: #fff; border: 2px solid #000; cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid #000;
  }
  #r { background: linear-gradient(90deg, #000, #f00); }
  #g { background: linear-gradient(90deg, #000, #0f0); }
  #b { background: linear-gradient(90deg, #000, #00f); }
  .picker { display: flex; gap: 10px; align-items: center; margin: 16px 0; }
  input[type=color] { width: 52px; height: 40px; border: 0; padding: 0; background: none; cursor: pointer; }
  .picker input[type=text] {
    flex: 1; height: 40px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); padding: 0 12px;
    font: 15px ui-monospace, Consolas, monospace;
  }
  .presets { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin: 16px 0; }
  .presets button {
    aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--line); cursor: pointer;
  }
  .actions { display: flex; gap: 10px; }
  .actions button {
    flex: 1; height: 42px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-weight: 600; cursor: pointer;
  }
  .actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .status { margin-top: 14px; font-size: 12px; color: var(--muted); min-height: 1.4em; }
  .status.err { color: #ff6b6b; }
</style>
</head>
<body>
<main class="card">
  <h1>Selector RGB</h1>
  <p class="sub" id="mode">Luz incorporada de la ESP32</p>

  <div class="preview" id="preview"><span id="hexLabel">#000000</span></div>

  <div class="row"><label for="r">R</label><input type="range" id="r" min="0" max="255" value="0"><output id="rv">0</output></div>
  <div class="row"><label for="g">G</label><input type="range" id="g" min="0" max="255" value="0"><output id="gv">0</output></div>
  <div class="row"><label for="b">B</label><input type="range" id="b" min="0" max="255" value="0"><output id="bv">0</output></div>

  <div class="picker">
    <input type="color" id="picker" value="#000000" aria-label="Selector de color">
    <input type="text" id="hex" value="#000000" maxlength="7" aria-label="Color hexadecimal">
  </div>

  <div class="presets" id="presets"></div>

  <div class="actions">
    <button id="off">Apagar</button>
    <button id="white" class="primary">Blanco</button>
  </div>

  <div class="status" id="status">Conectando…</div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const ch = ["r", "g", "b"].map($);
  const PRESETS = ["#ff0000", "#ff7f00", "#ffff00", "#00ff00",
                   "#00ffff", "#0000ff", "#8b00ff", "#ff00aa"];

  const toHex = (r, g, b) => "#" + [r, g, b].map(v => v.toString(16).padStart(2, "0")).join("");
  const fromHex = (h) => {
    const m = /^#?([0-9a-f]{6})$/i.exec(h.trim());
    if (!m) return null;
    const n = parseInt(m[1], 16);
    return [n >> 16, (n >> 8) & 255, n & 255];
  };

  function render([r, g, b]) {
    [r, g, b].forEach((v, i) => { ch[i].value = v; $(["rv","gv","bv"][i]).textContent = v; });
    const hex = toHex(r, g, b);
    $("picker").value = hex;
    if (document.activeElement !== $("hex")) $("hex").value = hex;
    $("hexLabel").textContent = hex;
    $("preview").style.background = hex;
    $("preview").style.boxShadow = `0 0 40px ${hex}66`;
  }

  // Envío con "último gana": mientras hay una petición en curso solo se guarda
  // el color más reciente, así arrastrar un slider no satura a la ESP32.
  let busy = false, pending = null;
  async function send(rgb) {
    render(rgb);
    if (busy) { pending = rgb; return; }
    busy = true;
    try {
      const [r, g, b] = rgb;
      const res = await fetch(`/api/color?r=${r}&g=${g}&b=${b}`, { method: "POST" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      setStatus("Color aplicado ✓");
    } catch (e) {
      setStatus("Sin respuesta de la placa (" + e.message + ")", true);
    } finally {
      busy = false;
      if (pending) { const next = pending; pending = null; send(next); }
    }
  }

  function setStatus(msg, err = false) {
    $("status").textContent = msg;
    $("status").classList.toggle("err", err);
  }

  ch.forEach(el => el.addEventListener("input", () => send(ch.map(c => +c.value))));
  $("picker").addEventListener("input", (e) => send(fromHex(e.target.value)));
  $("hex").addEventListener("input", (e) => { const c = fromHex(e.target.value); if (c) send(c); });
  $("off").addEventListener("click", () => send([0, 0, 0]));
  $("white").addEventListener("click", () => send([255, 255, 255]));

  PRESETS.forEach(h => {
    const b = document.createElement("button");
    b.style.background = h; b.title = h; b.setAttribute("aria-label", h);
    b.addEventListener("click", () => send(fromHex(h)));
    $("presets").appendChild(b);
  });

  const MODES = {
    neopixel: "LED WS2812 incorporado",
    rgb_pwm: "LED RGB (PWM por canal)",
    single: "LED monocolor: el color se aplica como brillo",
  };

  fetch("/api/color").then(r => r.json()).then(c => {
    render([c.r, c.g, c.b]);
    $("mode").textContent = MODES[c.mode] || c.mode;
    setStatus("Conectado a la placa");
  }).catch(() => setStatus("No se pudo leer el estado de la placa", true));
</script>
</body>
</html>
