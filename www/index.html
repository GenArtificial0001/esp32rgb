<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Selector RGB · ESP32</title>
<style>
  :root {
    --bg: #0f1115; --card: #181b22; --text: #e8eaf0; --muted: #8a90a0;
    --line: #2a2f3a; --accent: #4f8cff; --ok: #3ddc84; --err: #ff6b6b;
    --gap: clamp(12px, 3vw, 20px);
    --radius: clamp(16px, 4vw, 24px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    /* touch-action evita el zoom por doble toque al tocar botones seguidos */
    touch-action: manipulation;
    padding: max(var(--gap), env(safe-area-inset-top)) max(var(--gap), env(safe-area-inset-right))
             max(var(--gap), env(safe-area-inset-bottom)) max(var(--gap), env(safe-area-inset-left));
  }
  .app {
    max-width: 560px; margin: 0 auto; min-height: 100%;
    display: grid; gap: var(--gap); grid-template-rows: auto 1fr auto;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: clamp(18px, 5vw, 22px); margin: 0; }
  .dot {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--muted); white-space: nowrap;
  }
  .dot::before {
    content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--muted);
  }
  .dot.ok::before { background: var(--ok); }
  .dot.err::before { background: var(--err); }

  /* El input type=color ocupa toda la tarjeta: cualquier toque la abre. */
  .picker {
    position: relative; min-height: clamp(220px, 45dvh, 520px);
    border-radius: var(--radius); overflow: hidden;
    border: 1px solid var(--line); cursor: pointer;
    transition: box-shadow .2s;
  }
  .picker input {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; padding: 0; margin: 0; cursor: pointer;
    background: none; -webkit-appearance: none; appearance: none;
  }
  .picker input::-webkit-color-swatch-wrapper { padding: 0; }
  .picker input::-webkit-color-swatch { border: 0; border-radius: 0; }
  .picker input::-moz-color-swatch { border: 0; border-radius: 0; }
  .picker .hint {
    position: absolute; left: 50%; bottom: var(--gap); transform: translateX(-50%);
    pointer-events: none; text-align: center;
    background: rgba(0,0,0,.55); backdrop-filter: blur(6px);
    padding: 10px 18px; border-radius: 999px; white-space: nowrap;
  }
  .hint strong { display: block; font-size: clamp(15px, 4.5vw, 18px); }
  .hint span { font-size: 12px; color: #d0d4dd; }

  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: var(--gap); display: grid; gap: var(--gap);
  }
  .label { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); margin-bottom: 10px; }

  input[type=range] {
    width: 100%; height: 14px; border-radius: 999px; outline: none; margin: 8px 0;
    -webkit-appearance: none; appearance: none; background: var(--line);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 32px; height: 32px; border-radius: 50%;
    background: #fff; border: 3px solid var(--bg); box-shadow: 0 1px 6px rgba(0,0,0,.5);
  }
  input[type=range]::-moz-range-thumb {
    width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 3px solid var(--bg);
  }

  .presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 12px; }
  .presets button {
    aspect-ratio: 1; width: 100%; border-radius: 50%; cursor: pointer;
    border: 3px solid transparent; outline: 1px solid var(--line);
  }
  .presets button.on { border-color: #fff; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .actions button {
    min-height: 54px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); cursor: pointer;
    font-family: inherit; font-size: 16px; font-weight: 600;
  }
  .actions button:active, .presets button:active { transform: scale(.96); }
  .actions .primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  .confirm { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
  .confirm strong { color: var(--text); font-family: ui-monospace, Consolas, monospace; }
  .swatch { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); background: #000; flex: none; }
  .dot.wait::before { background: #f5b942; }

  /* Celular acostado o pantallas anchas: selector a la izquierda, controles a la derecha. */
  @media (min-width: 760px), (orientation: landscape) and (min-width: 560px) {
    .app { max-width: 1000px; grid-template-columns: 1.2fr 1fr; grid-template-rows: auto 1fr; }
    header { grid-column: 1 / -1; }
    .picker { min-height: 0; height: 100%; }
    .panel { align-content: start; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Selector RGB</h1>
    <span class="dot" id="status">Conectando…</span>
  </header>

  <label class="picker" id="pickerCard">
    <input type="color" id="color" value="#000000" aria-label="Elegir color de la luz">
    <span class="hint"><strong id="hex">#000000</strong><span>Tocá para elegir un color</span></span>
  </label>

  <section class="panel">
    <div>
      <div class="label"><span>Brillo</span><span id="brightVal">100%</span></div>
      <input type="range" id="bright" min="0" max="100" value="100" aria-label="Brillo">
    </div>
    <div>
      <div class="label"><span>Colores rápidos</span></div>
      <div class="presets" id="presets"></div>
    </div>
    <div class="confirm">
      <span class="swatch" id="ledSwatch"></span>
      <span>Color en la placa: <strong id="ledHex">—</strong></span>
    </div>
    <div class="actions">
      <button id="off">Apagar</button>
      <button id="white" class="primary">Blanco</button>
    </div>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const PRESETS = ["#ff0000", "#ff7f00", "#ffff00", "#00ff00", "#00ffff",
                   "#0000ff", "#8b00ff", "#ff00aa", "#ffb070", "#ffffff"];

  // Dos formas de llegar a la placa:
  //  - "local": la página la sirve la propia ESP32 (http://IP) -> API HTTP.
  //  - "mqtt":  la página está publicada en internet (GitHub Pages) o se fuerza
  //             con ?mqtt=1 -> broker MQTT público; así funciona también con
  //             la placa simulada en Wokwi, que no acepta conexiones entrantes.
  const params = new URLSearchParams(location.search);
  const DEVICE_ID = params.get("id") || "genartificial0001-rgb";  // = config.DEVICE_ID
  const MQTT_URL = "wss://broker.hivemq.com:8884/mqtt";
  const MODE = (location.protocol === "http:" && !params.has("mqtt")) ? "local" : "mqtt";
  const TOPIC = `esp32rgb/${DEVICE_ID}/`;

  // "base" es el color elegido a pleno; la placa recibe base × brillo.
  let base = "#ffffff";
  let bright = 100;
  let touched = false;  // el usuario ya eligió algo: no pisar su selección con el estado remoto

  const rgbOf = (h) => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
  const hexOf = (rgb) => "#" + rgb.map(v => v.toString(16).padStart(2, "0")).join("");
  const output = () => hexOf(rgbOf(base).map(v => Math.round(v * bright / 100)));

  function render() {
    $("color").value = base;
    $("hex").textContent = base.toUpperCase();
    $("brightVal").textContent = bright + "%";
    $("bright").style.background = `linear-gradient(90deg, #000, ${base})`;
    $("pickerCard").style.boxShadow = `0 0 60px ${base}55`;
    document.querySelectorAll(".presets button")
      .forEach(b => b.classList.toggle("on", b.dataset.c === base));
  }

  function showLed(hex) {
    $("ledHex").textContent = hex.toUpperCase();
    $("ledSwatch").style.background = hex;
  }

  function setStatus(msg, cls) {
    $("status").textContent = msg;
    $("status").className = "dot " + cls;
  }

  // Al recibir el color actual de la placa se usa como base con brillo 100%;
  // si estaba apagada se muestra blanco con brillo 0.
  function adoptRemote(hex) {
    showLed(hex);
    if (touched) return;
    if (hex === "#000000") { base = "#ffffff"; bright = 0; }
    else { base = hex; bright = 100; }
    $("bright").value = bright;
    render();
  }

  // ---------------------------------------------------------------------------
  // Cliente MQTT 3.1.1 mínimo sobre WebSocket (solo QoS 0: CONNECT, PUBLISH,
  // SUBSCRIBE, PINGREQ). Escrito a mano para no depender de librerías ni CDN.
  const enc = new TextEncoder(), dec = new TextDecoder();
  const str = (s) => { const b = enc.encode(s); return [b.length >> 8, b.length & 255, ...b]; };
  function packet(type, body) {
    const len = []; let n = body.length;
    do { let d = n % 128; n = Math.floor(n / 128); if (n) d |= 128; len.push(d); } while (n);
    return new Uint8Array([type, ...len, ...body]);
  }

  const mqtt = {
    ws: null, ready: false, buf: new Uint8Array(0), pingTimer: null,
    connect() {
      setStatus("Conectando…", "wait");
      const ws = this.ws = new WebSocket(MQTT_URL, "mqtt");
      ws.binaryType = "arraybuffer";
      ws.onopen = () => {
        const cid = "web-" + Math.random().toString(16).slice(2, 10);
        // Nivel 4 = MQTT 3.1.1; flags 0x02 = sesión limpia; keepalive 60 s.
        ws.send(packet(0x10, [...str("MQTT"), 4, 0x02, 0, 60, ...str(cid)]));
      };
      ws.onmessage = (e) => this.feed(new Uint8Array(e.data));
      ws.onclose = () => {
        this.ready = false; clearInterval(this.pingTimer);
        setStatus("Sin conexión al broker", "err");
        setTimeout(() => this.connect(), 3000);
      };
    },
    feed(chunk) {
      // Un mensaje WebSocket puede traer varios paquetes MQTT, o uno partido.
      const all = new Uint8Array(this.buf.length + chunk.length);
      all.set(this.buf); all.set(chunk, this.buf.length);
      let i = 0;
      while (i + 2 <= all.length) {
        let len = 0, mul = 1, j = i + 1, d;
        do {
          if (j >= all.length) { this.buf = all.slice(i); return; }
          d = all[j++]; len += (d & 127) * mul; mul *= 128;
        } while (d & 128);
        if (j + len > all.length) break;
        this.handle(all[i] >> 4, all.subarray(j, j + len));
        i = j + len;
      }
      this.buf = all.slice(i);
    },
    handle(type, body) {
      if (type === 2) {           // CONNACK
        if (body[1] !== 0) { setStatus("Broker rechazó la conexión", "err"); return; }
        this.ready = true;
        this.ws.send(packet(0x82, [0, 1, ...str(TOPIC + "state"), 0, ...str(TOPIC + "status"), 0]));
        this.pingTimer = setInterval(() => this.ws.send(new Uint8Array([0xc0, 0])), 30000);
        setStatus("Esperando placa…", "wait");
      } else if (type === 3) {    // PUBLISH (QoS 0: sin packet id)
        const tl = (body[0] << 8) | body[1];
        const topic = dec.decode(body.subarray(2, 2 + tl));
        const msg = dec.decode(body.subarray(2 + tl)).trim();
        if (topic.endsWith("/status")) {
          if (msg === "online") setStatus("Placa en línea", "ok");
          else setStatus("Placa desconectada", "err");
        } else if (topic.endsWith("/state") && /^#[0-9a-f]{6}$/i.test(msg)) {
          adoptRemote(msg.toLowerCase());
        }
      }
    },
    publish(topic, msg) {
      // retain: la placa recibe el último color aunque se conecte después.
      if (this.ready) this.ws.send(packet(0x31, [...str(topic), ...enc.encode(msg)]));
    },
  };

  // ---------------------------------------------------------------------------
  // Envío del color. Se limita a uno cada 120 ms y siempre sale el último, así
  // arrastrar el dedo no satura a la placa (ni al broker).
  let sendTimer = null, lastSent = 0;
  function push() {
    touched = true;
    const wait = Math.max(0, 120 - (Date.now() - lastSent));
    clearTimeout(sendTimer);
    sendTimer = setTimeout(sendNow, wait);
  }

  async function sendNow() {
    lastSent = Date.now();
    const hex = output();
    if (MODE === "mqtt") { mqtt.publish(TOPIC + "color", hex); return; }
    try {
      const res = await fetch(`/api/color?hex=${hex.slice(1)}`, { method: "POST" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      showLed((await res.json()).hex);
      setStatus("Conectado", "ok");
    } catch (e) {
      setStatus("Sin conexión", "err");
    }
  }

  // Elegir un color con la luz apagada la vuelve a encender a pleno.
  function choose(hex) {
    if (bright === 0) { bright = 100; $("bright").value = 100; }
    base = hex.toLowerCase(); render(); push();
  }

  // "input" se dispara mientras se mueve el dedo (Android/Chrome);
  // "change" cubre navegadores que solo avisan al cerrar el selector.
  $("color").addEventListener("input", (e) => choose(e.target.value));
  $("color").addEventListener("change", (e) => choose(e.target.value));
  $("bright").addEventListener("input", (e) => { bright = +e.target.value; render(); push(); });
  $("off").addEventListener("click", () => { bright = 0; $("bright").value = 0; render(); push(); });
  $("white").addEventListener("click", () => { bright = 100; $("bright").value = 100; choose("#ffffff"); });

  PRESETS.forEach(c => {
    const b = document.createElement("button");
    b.style.background = c; b.dataset.c = c; b.setAttribute("aria-label", "Color " + c);
    b.addEventListener("click", () => choose(c));
    $("presets").appendChild(b);
  });

  render();
  if (MODE === "mqtt") {
    mqtt.connect();
  } else {
    fetch("/api/color").then(r => r.json()).then(c => {
      adoptRemote(c.hex);
      setStatus("Conectado", "ok");
    }).catch(() => setStatus("Sin conexión", "err"));
  }
</script>
</body>
</html>
